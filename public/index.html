<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laar Institute Management System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172333}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#1b496d)}.loginbox{width:390px;background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 60px #0003}.brand{font-size:28px;font-weight:800;color:#102a43}.brand span{color:#d4a72c}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd7e2;border-radius:7px;font:inherit;background:#fff}textarea{min-height:80px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
button,.btn{background:#1261a0;color:#fff;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700;text-decoration:none}.danger{color:#a52222}.err{background:#fdeaea;color:#9e2323;padding:10px;border-radius:7px;margin:12px 0}.app{display:flex;min-height:100vh}.side{width:245px;background:#102a43;color:#fff;padding:20px;position:fixed;top:0;bottom:0}.side h2{margin:0 0 22px}.side button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}.side button:hover{background:#1d4668}.content{margin-left:245px;padding:28px;width:calc(100% - 245px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 16px #18344a12;margin-bottom:16px}.stat b{font-size:30px;display:block;margin-top:6px}.muted{color:#718096}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e7edf3;text-align:left;white-space:nowrap}th{font-size:12px;background:#f8fafc}.bar{height:13px;background:#e4ebf2;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#1261a0}.pill{padding:4px 8px;border-radius:15px;background:#edf4fa;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.search{max-width:260px}
@media(max-width:850px){.side{transform:translateX(-100%);z-index:5}.app.open .side{transform:translateX(0)}.content{margin-left:0;width:100%;padding:16px}.cards{grid-template-columns:1fr 1fr}.grid,.form{grid-template-columns:1fr}.menu{display:block!important}}
.menu{display:none;background:#102a43}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand">LAAR <span>Institute</span></div><h2>Management System</h2><p class="muted">Principal Login</p><div id="loginErr" class="err hidden"></div><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button style="width:100%;margin-top:16px" onclick="login()">Login</button></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>LAAR Institute</h2><div id="nav"></div><button onclick="logout()" style="margin-top:25px">Logout</button></aside><main class="content"><header><button class="menu" onclick="document.getElementById('app').classList.toggle('open')">☰</button><div><h1 id="title">Dashboard</h1><div class="muted" id="date"></div></div></header><div id="view"></div></main></div>
<script>
const API="/api";let token=localStorage.getItem("lit_token"), data=null;
const modules=[["dashboard","Dashboard"],["students","Students"],["teachers","Teachers"],["courses","Courses"],["outline","Course Outline"],["shifts","Shifts"],["batches","Batches"],["classes","Daily Classes"],["attendance","Attendance"],["progress","Progress"],["practical","Practical Work"],["tests","Tests & Results"]];
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function api(path="",opts={}){opts.headers={...(opts.headers||{}),"Content-Type":"application/json",Authorization:"Bearer "+token};let r=await fetch(API+path,opts);if(r.status===401){logout();throw Error("Unauthorized")}return r.json()}
async function login(){let r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});let x=await r.json();if(!r.ok){loginErr.textContent=x.error;loginErr.classList.remove("hidden");return}localStorage.setItem("lit_token",x.token);token=x.token;start()}
function logout(){localStorage.removeItem("lit_token");location.reload()}
async function start(){if(!token)return;try{data=await api();document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");date.textContent=new Date().toLocaleDateString();nav.innerHTML=modules.map(m=>`<button onclick="show('${m[0]}')">${m[1]}</button>`).join("");show("dashboard")}catch(e){}}
function save(entity,item){return api("",{method:"POST",body:JSON.stringify({entity,item})}).then(()=>api().then(x=>{data=x;show(current)}))}
function del(entity,id){if(confirm("Delete this record?"))api("",{method:"DELETE",body:JSON.stringify({entity,id})}).then(()=>api().then(x=>{data=x;show(current)}))}
let current="dashboard";
function show(v){current=v;title.textContent=modules.find(x=>x[0]===v)?.[1]||"Dashboard";({dashboard,students,teachers,courses,outline,shifts,batches,classes,attendance,progress,practical,tests}[v])()}
function formFields(fields){return fields.map(f=>`<div class="${f[2]?'full':''}"><label>${f[1]}</label>${f[3]||`<input id="${f[0]}" placeholder="${f[4]||""}">`}</div>`).join("")}
function pick(id,label,arr,name="name"){return `<div><label>${label}</label><select id="${id}">${arr.map(x=>`<option value="${x.id}">${esc(x[name])}</option>`).join("")}</select></div>`}
function dashboard(){let s=data.students.length,t=data.teachers.length,c=data.courses.length,sh=data.shifts.length;view.innerHTML=`<div class="cards"><div class="card stat">Active Students<b>${s}</b></div><div class="card stat">Teachers<b>${t}</b></div><div class="card stat">Courses<b>${c}</b></div><div class="card stat">Shifts<b>${sh}</b></div></div><div class="card"><h2>Institute Management</h2><p class="muted">Principal can manage students, teachers, courses, shifts, batches, daily classes, attendance, progress, practical work and tests from the menu.</p></div>`}
function students(){let rows=data.students.map(s=>{let c=data.courses.find(x=>x.id===s.courseId)?.name||"-",sh=data.shifts.find(x=>x.id===s.shiftId)?.name||"-",t=data.teachers.find(x=>x.id===s.teacherId)?.name||"-";return `<tr><td>${esc(s.studentId)}</td><td>${esc(s.name)}</td><td>${esc(c)}</td><td>${esc(sh)}</td><td>${esc(t)}</td><td>${esc(s.status)}</td><td><button onclick="del('students','${s.id}')">Delete</button></td></tr>`}).join("");view.innerHTML=`<div class="card"><h2>Add New Student</h2><div class="form">${formFields([["sid","Student ID *"],["sn","Full Name *"],["father","Father Name"],["phone","Mobile"],["wa","WhatsApp"],["email","Email"],["edu","Education"],["admission","Admission Date"]])}${pick("sc","Course",data.courses)}${pick("ssh","Shift",data.shifts)}${pick("sb","Batch",data.batches)}${pick("st","Teacher",data.teachers)}<div><label>Status</label><select id="ss"><option>Active</option><option>Completed</option><option>On Hold</option><option>Dropped</option><option>Inactive</option></select></div><div class="full"><label>Address / Notes</label><textarea id="notes"></textarea></div></div><button onclick="addStudent()">Add Student</button></div><div class="card"><div class="topline"><h2>Student List</h2><input class="search" oninput="filterRows(this)" placeholder="Search..."></div><div class="table"><table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Shift</th><th>Teacher</th><th>Status</th><th></th></tr></thead><tbody id="rows">${rows}</tbody></table></div></div>`}
function addStudent(){save("students",{studentId:sid.value,name:sn.value,fatherName:father.value,phone:phone.value,whatsapp:wa.value,email:email.value,education:edu.value,admissionDate:admission.value||new Date().toISOString().slice(0,10),courseId:sc.value,shiftId:ssh.value,batchId:sb.value,teacherId:st.value,status:ss.value,notes:notes.value})}
function teachers(){let rows=data.teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.email||"")}</td><td>${data.students.filter(s=>s.teacherId===t.id).length}</td><td>${esc(t.status||"Active")}</td><td><button onclick="del('teachers','${t.id}')">Delete</button></td></tr>`).join("");view.innerHTML=`<div class="card"><h2>Add Teacher Account</h2><div class="form">${formFields([["tn","Full Name *"],["te","Email"],["tp","Mobile"],["tq","Qualification"]])}</div><button onclick="save('teachers',{name:tn.value,email:te.value,phone:tp.value,qualification:tq.value,status:'Active'})">Create Teacher</button></div><div class="card"><h2>Teachers</h2><div class="table"><table><tr><th>Name</th><th>Email</th><th>Students</th><th>Status</th><th></th></tr>${rows}</table></div></div>`}
function courses(){let rows=data.courses.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.code)}</td><td>${esc(c.duration)}</td><td>${data.students.filter(s=>s.courseId===c.id).length}</td><td><button onclick="del('courses','${c.id}')">Delete</button></td></tr>`).join("");view.innerHTML=`<div class="card"><h2>Add Course</h2><div class="form">${formFields([["cn","Course Name *"],["cc","Code"],["cd","Duration"],["cx","Description",true])}</div><button onclick="save('courses',{name:cn.value,code:cc.value,duration:cd.value,description:cx.value})">Save Course</button></div><div class="card"><h2>Courses</h2><table><tr><th>Name</th><th>Code</th><th>Duration</th><th>Students</th><th></th></tr>${rows}</table></div>`}
function shifts(){let rows=data.shifts.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.start)} – ${esc(s.end)}</td><td>${esc(s.days)}</td><td>${data.students.filter(x=>x.shiftId===s.id).length}</td><td><button onclick="del('shifts','${s.id}')">Delete</button></td></tr>`).join("");view.innerHTML=`<div class="card"><h2>Create Shift</h2><div class="form">${formFields([["shn","Shift Name *"],["shs","Start Time"],["she","End Time"],["shd","Days"]])}</div><button onclick="save('shifts',{name:shn.value,start:shs.value,end:she.value,days:shd.value})">Create Shift</button></div><div class="card"><h2>Shifts</h2><table><tr><th>Name</th><th>Time</th><th>Days</th><th>Students</th><th></th></tr>${rows}</table></div>`}
function batches(){let rows=data.batches.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(data.courses.find(x=>x.id===b.courseId)?.name)}</td><td>${esc(data.shifts.find(x=>x.id===b.shiftId)?.name)}</td><td>${esc(data.teachers.find(x=>x.id===b.teacherId)?.name||"-")}</td><td>${data.students.filter(s=>s.batchId===b.id).length}</td><td><button onclick="del('batches','${b.id}')">Delete</button></td></tr>`).join("");view.innerHTML=`<div class="card"><h2>Create Batch</h2><div class="form">${formFields([["bn","Batch Name *"],["bd","Start Date"]])}${pick("bc","Course",data.courses)}${pick("bs","Shift",data.shifts)}${pick("bt","Teacher",data.teachers)}</div><button onclick="save('batches',{name:bn.value,startDate:bd.value,courseId:bc.value,shiftId:bs.value,teacherId:bt.value,status:'Active'})">Create Batch</button></div><div class="card"><h2>Batches</h2><table><tr><th>Batch</th><th>Course</th><th>Shift</th><th>Teacher</th><th>Students</th><th></th></tr>${rows}</table></div>`}
function outline(){view.innerHTML=`<div class="card"><h2>Course Outline</h2><p class="muted">Create modules and topics for each course. Student progress uses these topics.</p>${data.courses.map(c=>`<div class="card" style="box-shadow:none;border:1px solid #e3eaf0"><h3>${esc(c.name)}</h3><button onclick="addModule('${c.id}')">+ Add Module</button>${data.modules.filter(m=>m.courseId===c.id).map(m=>`<div style="padding:12px;border-top:1px solid #eee"><b>${esc(m.name)}</b> <button onclick="addTopic('${m.id}')">+ Topic</button>${data.topics.filter(t=>t.moduleId===m.id).map(t=>`<div class="pill" style="margin:5px">${esc(t.name)}</div>`).join("")}</div>`).join("")}</div>`).join("")}</div>`}
function addModule(cid){let n=prompt("Module name");if(n)save("modules",{courseId:cid,name:n})}
function addTopic(mid){let n=prompt("Topic name");if(n)save("topics",{moduleId:mid,name:n})}
function classes(){view.innerHTML=`<div class="card"><h2>Today's / Daily Class Record</h2><div class="form">${pick("lc","Course",data.courses)}${pick("lb","Batch",data.batches)}<div><label>Date</label><input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Module</label><input id="lm"></div><div class="full"><label>Today's Topic *</label><input id="lt"></div><div><label>Learning Objective</label><textarea id="lo"></textarea></div><div><label>Theory</label><textarea id="lth"></textarea></div><div><label>Practical</label><textarea id="lp"></textarea></div><div><label>Homework</label><textarea id="lh"></textarea></div><div><label>Next Topic</label><input id="ln"></div></div><button onclick="save('lessons',{date:ld.value,courseId:lc.value,batchId:lb.value,module:lm.value,topic:lt.value,objective:lo.value,theory:lth.value,practical:lp.value,homework:lh.value,nextTopic:ln.value})">Save Daily Class</button></div><div class="card"><h2>Class History</h2><table><tr><th>Date</th><th>Course</th><th>Batch</th><th>Topic</th><th>Next</th></tr>${data.lessons.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(data.courses.find(c=>c.id===x.courseId)?.name)}</td><td>${esc(data.batches.find(b=>b.id===x.batchId)?.name||"-")}</td><td>${esc(x.topic)}</td><td>${esc(x.nextTopic)}</td></tr>`).join("")}</table></div>`}
function attendance(){let today=new Date().toISOString().slice(0,10);view.innerHTML=`<div class="card"><h2>Attendance</h2><label>Date</label><input id="ad" type="date" value="${today}"><div class="table"><table><tr><th>Student</th><th>Course</th><th>Shift</th><th>Status</th></tr>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(data.courses.find(c=>c.id===s.courseId)?.name)}</td><td>${esc(data.shifts.find(x=>x.id===s.shiftId)?.name)}</td><td><select id="att_${s.id}"><option>Present</option><option>Absent</option><option>Late</option><option>Leave</option></select></td></tr>`).join("")}</table></div><button onclick="saveAttendance()">Save Attendance</button></div>`}
function saveAttendance(){let date=ad.value;Promise.all(data.students.map(s=>saveRaw("attendance",{studentId:s.id,date,status:document.getElementById("att_"+s.id).value}))).then(()=>api().then(x=>{data=x;show("attendance")}))}
async function saveRaw(entity,item){return api("",{method:"POST",body:JSON.stringify({entity,item})})}
function progress(){view.innerHTML=`<div class="card"><h2>Student Progress</h2>${data.students.map(s=>{let topics=data.topics.filter(t=>data.modules.find(m=>m.id===t.moduleId)?.courseId===s.courseId),done=topics.filter(t=>data.progress.find(p=>p.studentId===s.id&&p.topicId===t.id&&p.status==="Completed")).length,pct=topics.length?Math.round(done/topics.length*100):0;return `<div style="margin:18px 0"><b>${esc(s.name)}</b><span class="muted"> — ${esc(data.courses.find(c=>c.id===s.courseId)?.name||"")}</span><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% (${done}/${topics.length} topics completed)</small><div class="actions" style="margin-top:7px"><button onclick="updateProgress('${s.id}')">Update Topics</button></div></div>`}).join("")}</div>`}
function updateProgress(sid){let s=data.students.find(x=>x.id===sid),ts=data.topics.filter(t=>data.modules.find(m=>m.id===t.moduleId)?.courseId===s.courseId);ts.forEach(t=>{let p=data.progress.find(x=>x.studentId===sid&&x.topicId===t.id);let v=prompt("Status for "+t.name+" (Pending / In Progress / Completed)",p?.status||"Pending");if(v&&["Pending","In Progress","Completed"].includes(v))saveRaw("progress",{studentId:sid,topicId:t.id,status:v})});setTimeout(()=>api().then(x=>{data=x;show("progress")}),500)}
function practical(){view.innerHTML=`<div class="card"><h2>Practical Work</h2><div class="form">${pick("ps","Student",data.students)}<div><label>Task</label><input id="pt"></div><div><label>Status</label><select id="pst"><option>Not Started</option><option>In Progress</option><option>Completed</option><option>Needs Improvement</option></select></div><div><label>Remarks</label><input id="pr"></div></div><button onclick="save('practicals',{studentId:ps.value,title:pt.value,status:pst.value,remarks:pr.value})">Save Practical Task</button></div><div class="card"><table><tr><th>Student</th><th>Task</th><th>Status</th><th>Remarks</th></tr>${data.practicals.slice().reverse().map(p=>`<tr><td>${esc(data.students.find(s=>s.id===p.studentId)?.name)}</td><td>${esc(p.title)}</td><td>${esc(p.status)}</td><td>${esc(p.remarks)}</td></tr>`).join("")}</table></div>`}
function tests(){view.innerHTML=`<div class="grid"><div class="card"><h2>Create Test</h2><div class="form">${formFields([["tnm","Test Name *"],["td","Date"]])}${pick("tc","Course",data.courses)}<div><label>Total Marks</label><input id="tm" type="number" value="100"></div><div><label>Passing Marks</label><input id="pm" type="number" value="40"></div></div><button onclick="save('tests',{name:tnm.value,date:td.value,courseId:tc.value,total:tm.value,passing:pm.value})">Create Test</button></div><div class="card"><h2>Enter Result</h2>${pick("rt","Test",data.tests,"name")}${pick("rs","Student",data.students)}<label>Marks</label><input id="rm" type="number"><label>Remarks</label><input id="rr"><button onclick="save('results',{testId:rt.value,studentId:rs.value,marks:rm.value,remarks:rr.value})">Save Result</button></div></div><div class="card"><h2>Results</h2><table><tr><th>Test</th><th>Student</th><th>Marks</th><th>Remarks</th></tr>${data.results.slice().reverse().map(r=>`<tr><td>${esc(data.tests.find(t=>t.id===r.testId)?.name)}</td><td>${esc(data.students.find(s=>s.id===r.studentId)?.name)}</td><td>${esc(r.marks)}</td><td>${esc(r.remarks)}</td></tr>`).join("")}</table></div>`}
function filterRows(i){let q=i.value.toLowerCase();document.querySelectorAll("#rows tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
start();
</script></body></html>
